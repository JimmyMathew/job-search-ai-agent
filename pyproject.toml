[project]
name = "job-search-agent"
version = "0.2.0"
description = "Finds new LinkedIn jobs that match your resume and adds them to an Excel file on your computer."
requires-python = ">=3.10"
dependencies = [
    "python-jobspy>=1.1.80",
    "openpyxl>=3.1",
    "PyYAML>=6.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
pythonpath = ["scripts"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
